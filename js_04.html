<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiệu chỉnh theo sự kiện chuột</title>
    <style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    padding: 30px;
    background-color: #f0f8ff;
}

h2 {
    text-align: center;
    color: #1565c0;
    margin-bottom: 30px;
}

h3 {
    margin-top: 25px;
    margin-bottom: 15px;
    color: #333;
}

/* Yêu cầu 1 */
#hoverBox {
    width: 200px;
    padding: 20px;
    background-color: #2196f3;
    color: white;
    text-align: center;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
}

/* Yêu cầu 2 */
#myImage {
    width: 200px;
    transition: transform 0.3s;
}

#myImage:hover {
    transform: scale(1.1);
}

/* Yêu cầu 3 và 4 */
button {
    padding: 10px 20px;
    background-color: #2196f3;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    background-color: #0d47a1;
}

input {
    padding: 10px;
    width: 250px;
    border: 1px solid #999;
    border-radius: 5px;
}

#dateResult {
    margin-top: 10px;
    color: #1565c0;
    font-weight: bold;
}
    </style>
</head>
<body>
     <h2>BÀI 3.2.1 - HIỆU CHỈNH THEO SỰ KIỆN CHUỘT</h2>

    <!-- Yêu cầu 1 -->
    <h3>1. Thay đổi nội dung khi di chuyển chuột</h3>
    <div id="hoverBox">Hover Me</div>

    <!-- Yêu cầu 2 -->
    <h3>2. Thay đổi kích thước hình ảnh</h3>
    <img id="myImage" src="images/image.jpg" alt="Hình ảnh">

    <!-- Yêu cầu 3 -->
    <h3>3. Hiển thị ngày giờ hiện tại</h3>
    <button id="dateButton">Hiển thị ngày giờ</button>
    <p id="dateResult"></p>

    <!-- Yêu cầu 4 -->
    <h3>4. Chuyển nội dung textbox thành chữ in hoa</h3>
    <input type="text" id="myText" placeholder="Nhập nội dung...">
    <button id="upperButton">Chuyển chữ in hoa</button>

     <script>
     
// Yêu cầu 1: Thay đổi nội dung thẻ div
let hoverBox = document.getElementById("hoverBox");

hoverBox.onmouseover = function() {
    hoverBox.innerHTML = "Mouse Event";
};

hoverBox.onmouseout = function() {
    hoverBox.innerHTML = "Hover Me";
};


// Yêu cầu 2: Tăng kích thước hình ảnh 10%
let myImage = document.getElementById("myImage");

myImage.onmouseover = function() {
    myImage.style.transform = "scale(1.1)";
};

myImage.onmouseout = function() {
    myImage.style.transform = "scale(1)";
};


// Yêu cầu 3: Hiển thị ngày giờ hiện tại
let dateButton = document.getElementById("dateButton");

dateButton.onclick = function() {
    let now = new Date();

    document.getElementById("dateResult").innerHTML =
        "Ngày giờ hiện tại: " + now.toLocaleString("vi-VN");
};


// Yêu cầu 4: Chuyển textbox thành chữ in hoa
let upperButton = document.getElementById("upperButton");

upperButton.onclick = function() {
    let myText = document.getElementById("myText");

    myText.value = myText.value.toUpperCase();
};

     </script>
</body>
</html>
